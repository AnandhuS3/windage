<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0a"/>
  <!-- Camera body -->
  <rect x="10" y="20" width="44" height="28" rx="5" fill="#1a1a1a" stroke="#E31B23" stroke-width="2"/>
  <!-- Lens ring outer -->
  <circle cx="32" cy="34" r="10" fill="#050505" stroke="#E31B23" stroke-width="2"/>
  <!-- Lens ring inner -->
  <circle cx="32" cy="34" r="6" fill="#0d0d0d" stroke="#333" stroke-width="1"/>
  <!-- Lens center dot -->
  <circle cx="32" cy="34" r="2.5" fill="#E31B23"/>
  <!-- Viewfinder bump -->
  <rect x="22" y="14" width="12" height="8" rx="3" fill="#1a1a1a" stroke="#E31B23" stroke-width="1.5"/>
  <!-- Record indicator dot -->
  <circle cx="50" cy="25" r="3" fill="#E31B23"/>
</svg>
